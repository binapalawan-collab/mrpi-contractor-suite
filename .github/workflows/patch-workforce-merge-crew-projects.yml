name: Patch Workforce Merge Crew Projects

on:
  push:
    paths:
      - '.github/workflows/patch-workforce-merge-crew-projects.yml'
      - '.github/scripts/patch_workforce_merge_crew_projects.py'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply patch
        run: python3 .github/scripts/patch_workforce_merge_crew_projects.py
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate Workforce
        working-directory: apps/mrpi-workforce
        run: |
          npm ci --no-audit --no-fund
          npm run lint
          npm test
          npm run build
      - name: Commit patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/mrpi-workforce/src/pages/WagePage.tsx
          git diff --cached --quiet && exit 0
          git commit -m 'feat(workforce): merge crew balances across projects'
          git push
