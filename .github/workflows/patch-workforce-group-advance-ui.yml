name: Patch Workforce Group Advance UI

on:
  push:
    paths:
      - '.github/workflows/patch-workforce-group-advance-ui.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply source patch
        env:
          PATCH_B64: 
      - name: Run patch
        run: echo "$PATCH_B64" | base64 -d | python3
      - name: Commit patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/mrpi-workforce/src/types/domain.ts apps/mrpi-workforce/src/lib/queries.ts apps/mrpi-workforce/src/pages/WagePage.tsx
          git commit -m 'feat(workforce): handle crew advances as group deductions'
          git push
