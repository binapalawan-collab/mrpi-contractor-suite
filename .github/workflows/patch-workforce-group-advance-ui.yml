name: Patch Workforce group advance UI

on:
  push:
    paths:
      - '.github/workflows/patch-workforce-group-advance-ui.yml'

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Patch Workforce source
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(text, old, new, label):
              if old not in text:
                  raise SystemExit(f'Missing patch target: {label}')
              return text.replace(old, new, 1)

          domain = Path('apps/mrpi-workforce/src/types/domain.ts')
          s = domain.read_text()
          s = replace_once(s,
            "export type WorkerAdvance={id:number;worker_id:number;project_id:number;advance_date:string;amount:number;payment_method:PaymentMethod;notes:string;applied_wage_payment_id:number|null;created_at:string}",
            "export type WorkerAdvance={id:number;worker_id:number;project_id:number;advance_date:string;amount:number;payment_method:PaymentMethod;notes:string;advance_scope?:'worker'|'crew';applied_wage_payment_id:number|null;applied_wage_batch_id?:number|null;created_at:string}",
            'WorkerAdvance type')
          s = replace_once(s,
            "export type WagePayment={id:number;worker_id:number;project_id:number;period_start:string;period_end:string;payment_date:string;gross_amount:number;advance_deduction:number;net_amount:number;payment_method:PaymentMethod;notes:string;recipient_worker_id?:number|null;wage_batch_id?:number|null;created_at:string}",
            "export type WagePayment={id:number;worker_id:number;project_id:number;period_start:string;period_end:string;payment_date:string;gross_amount:number;advance_deduction:number;crew_advance_deduction?:number;net_amount:number;payment_method:PaymentMethod;notes:string;recipient_worker_id?:number|null;wage_batch_id?:number|null;created_at:string}",
            'WagePayment type')
          s = replace_once(s,
            "export type WagePaymentBatch={id:number;head_worker_id:number;project_id:number;company_id:number;owner_user_id:string;period_start:string;period_end:string;payment_date:string;payment_method:PaymentMethod;total_gross:number;total_advance_deduction:number;total_net_amount:number;notes:string;created_at:string}",
            "export type WagePaymentBatch={id:number;head_worker_id:number;project_id:number;company_id:number;owner_user_id:string;period_start:string;period_end:string;payment_date:string;payment_method:PaymentMethod;total_gross:number;total_advance_deduction:number;group_advance_deduction?:number;total_net_amount:number;notes:string;created_at:string}",
            'WagePaymentBatch type')
          domain.write_text(s)

          queries = Path('apps/mrpi-workforce/src/lib/queries.ts')
          s = queries.read_text()
          s = replace_once(s,
            "export async function loadAdvances(unappliedOnly=false){let query=configured().from('worker_advances').select('*').order('advance_date',{ascending:false}).order('id',{ascending:false});if(unappliedOnly)query=query.is('applied_wage_payment_id',null);const {data,error}=await query;if(error)throw error;return (data??[]).map((row)=>({...row,worker_id:Number(row.worker_id),project_id:Number(row.project_id),amount:Number(row.amount)})) as WorkerAdvance[]}",
            "export async function loadAdvances(unappliedOnly=false){let query=configured().from('worker_advances').select('*').order('advance_date',{ascending:false}).order('id',{ascending:false});if(unappliedOnly)query=query.is('applied_wage_payment_id',null).is('applied_wage_batch_id',null);const {data,error}=await query;if(error)throw error;return (data??[]).map((row)=>({...row,worker_id:Number(row.worker_id),project_id:Number(row.project_id),amount:Number(row.amount),advance_scope:row.advance_scope==='crew'?'crew':'worker',applied_wage_batch_id:row.applied_wage_batch_id===null||row.applied_wage_batch_id===undefined?null:Number(row.applied_wage_batch_id)})) as WorkerAdvance[]}",
            'loadAdvances')
          s = replace_once(s,
            "export async function loadWorkerAdvances(workerId:number,fromDate?:string,toDate?:string){let query=configured().from('worker_advances').select('*').eq('worker_id',workerId).order('advance_date',{ascending:false}).order('id',{ascending:false});if(fromDate)query=query.gte('advance_date',fromDate);if(toDate)query=query.lte('advance_date',toDate);const {data,error}=await query;if(error)throw error;return (data??[]).map((row)=>({...row,worker_id:Number(row.worker_id),project_id:Number(row.project_id),amount:Number(row.amount)})) as WorkerAdvance[]}",
            "export async function loadWorkerAdvances(workerId:number,fromDate?:string,toDate?:string){let query=configured().from('worker_advances').select('*').eq('worker_id',workerId).eq('advance_scope','worker').order('advance_date',{ascending:false}).order('id',{ascending:false});if(fromDate)query=query.gte('advance_date',fromDate);if(toDate)query=query.lte('advance_date',toDate);const {data,error}=await query;if(error)throw error;return (data??[]).map((row)=>({...row,worker_id:Number(row.worker_id),project_id:Number(row.project_id),amount:Number(row.amount),advance_scope:'worker',applied_wage_batch_id:row.applied_wage_batch_id===null||row.applied_wage_batch_id===undefined?null:Number(row.applied_wage_batch_id)})) as WorkerAdvance[]}",
            'loadWorkerAdvances')
          s = replace_once(s,
            "export function normalizeWagePayment(row:Record<string,unknown>){return {...row,id:Number(row.id),worker_id:Number(row.worker_id),project_id:Number(row.project_id),gross_amount:Number(row.gross_amount),advance_deduction:Number(row.advance_deduction),net_amount:Number(row.net_amount),recipient_worker_id:row.recipient_worker_id===null||row.recipient_worker_id===undefined?null:Number(row.recipient_worker_id),wage_batch_id:row.wage_batch_id===null||row.wage_batch_id===undefined?null:Number(row.wage_batch_id)} as WagePayment}",
            "export function normalizeWagePayment(row:Record<string,unknown>){return {...row,id:Number(row.id),worker_id:Number(row.worker_id),project_id:Number(row.project_id),gross_amount:Number(row.gross_amount),advance_deduction:Number(row.advance_deduction),crew_advance_deduction:Number(row.crew_advance_deduction??0),net_amount:Number(row.net_amount),recipient_worker_id:row.recipient_worker_id===null||row.recipient_worker_id===undefined?null:Number(row.recipient_worker_id),wage_batch_id:row.wage_batch_id===null||row.wage_batch_id===undefined?null:Number(row.wage_batch_id)} as WagePayment}",
            'normalizeWagePayment')
          queries.write_text(s)

          wage = Path('apps/mrpi-workforce/src/pages/WagePage.tsx')
          s = wage.read_text()
          s = replace_once(s,
            "  advances: number\n  netPay: number\n  start: string",
            "  advances: number\n  groupAdvances: number\n  netPay: number\n  start: string",
            'CrewProjectSummary groupAdvances')
          s = replace_once(s,
            ".filter((advance) => advance.worker_id === worker.id)\n      .reduce((sum, advance) => sum + advance.amount, 0))",
            ".filter((advance) => advance.worker_id === worker.id && (advance.advance_scope ?? 'worker') === 'worker')\n      .reduce((sum, advance) => sum + advance.amount, 0))",
            'personal worker advances')
          s = s.replace(
            "const workerAdvanceRows = advances.filter((advance) => advance.worker_id === group.worker.id && advance.project_id === project.id)",
            "const workerAdvanceRows = advances.filter((advance) => advance.worker_id === group.worker.id && advance.project_id === project.id && (advance.advance_scope ?? 'worker') === 'worker')")
          s = replace_once(s,
            "        dates.sort()\n        summaries.push({\n          leader,\n          project,\n          workerCount: owingWorkerIds.size,\n          workDays,\n          outstanding,\n          advances: advanceTotal,\n          netPay: roundMoney(Math.max(0, outstanding - advanceTotal)),",
            "        const groupAdvanceRows = advances.filter((advance) => advance.worker_id === leader.id && advance.project_id === project.id && advance.advance_scope === 'crew')\n        const groupAdvances = deductibleAdvances(groupAdvanceRows, Math.max(0, roundMoney(outstanding - advanceTotal)))\n        advanceTotal = roundMoney(advanceTotal + groupAdvances)\n        dates.sort()\n        summaries.push({\n          leader,\n          project,\n          workerCount: owingWorkerIds.size,\n          workDays,\n          outstanding,\n          advances: advanceTotal,\n          groupAdvances,\n          netPay: roundMoney(Math.max(0, outstanding - advanceTotal)),",
            'crew summary group advance')
          s = replace_once(s,
            "advance.worker_id === Number(workerId) && advance.project_id === Number(projectId)",
            "advance.worker_id === Number(workerId) && advance.project_id === Number(projectId) && (advance.advance_scope ?? 'worker') === 'worker'",
            'eligible personal advances')
          s = s.replace(
            "const workerAdvanceRows = advances.filter((advance) => advance.worker_id === worker.id && advance.project_id === selectedCrewProject.id)",
            "const workerAdvanceRows = advances.filter((advance) => advance.worker_id === worker.id && advance.project_id === selectedCrewProject.id && (advance.advance_scope ?? 'worker') === 'worker')")
          old_totals = """  const crewTotals = useMemo(() => crewPaymentRows.reduce((totals, row) => ({
    outstanding: roundMoney(totals.outstanding + row.outstanding),
    advances: roundMoney(totals.advances + row.advances),
    cash: roundMoney(totals.cash + row.cash),
  }), { outstanding: 0, advances: 0, cash: 0 }), [crewPaymentRows])"""
          new_totals = """  const crewBaseTotals = useMemo(() => crewPaymentRows.reduce((totals, row) => ({
    outstanding: roundMoney(totals.outstanding + row.outstanding),
    advances: roundMoney(totals.advances + row.advances),
  }), { outstanding: 0, advances: 0 }), [crewPaymentRows])
  const crewGroupAdvances = useMemo(() => {
    if (!selectedCrewLeader || !selectedCrewProject) return 0
    const groupAdvanceRows = advances.filter((advance) => (
      advance.worker_id === selectedCrewLeader.id
      && advance.project_id === selectedCrewProject.id
      && advance.advance_scope === 'crew'
    ))
    return deductibleAdvances(groupAdvanceRows, Math.max(0, roundMoney(crewBaseTotals.outstanding - crewBaseTotals.advances)))
  }, [advances, crewBaseTotals.advances, crewBaseTotals.outstanding, selectedCrewLeader, selectedCrewProject])
  const crewTotals = useMemo(() => {
    const advancesTotal = roundMoney(crewBaseTotals.advances + crewGroupAdvances)
    return {
      outstanding: crewBaseTotals.outstanding,
      personalAdvances: crewBaseTotals.advances,
      groupAdvances: crewGroupAdvances,
      advances: advancesTotal,
      cash: roundMoney(Math.max(0, crewBaseTotals.outstanding - advancesTotal)),
    }
  }, [crewBaseTotals, crewGroupAdvances])"""
          s = replace_once(s, old_totals, new_totals, 'crew totals')
          s = replace_once(s,
            "const { error: advanceError } = await supabase.rpc('record_worker_advance', {",
            "const { error: advanceError } = await supabase.rpc('record_worker_advance_scoped', {",
            'scoped advance rpc')
          s = replace_once(s,
            "        p_notes: String(form.get('notes') || ''),\n      })",
            "        p_notes: String(form.get('notes') || ''),\n        p_advance_scope: String(form.get('advance_scope') || 'worker'),\n      })",
            'advance scope rpc param')
          s = replace_once(s,
            "        <WorkerProjectFields workers={workers} projects={projects} />\n        <label><span className=\"field-label\">Tarikh</span>",
            "        <WorkerProjectFields workers={workers} projects={projects} />\n        <label><span className=\"field-label\">Jenis pinjaman</span><select name=\"advance_scope\" className=\"field-control\" defaultValue=\"worker\"><option value=\"worker\">Pinjaman individu</option><option value=\"crew\">Pinjaman kumpulan · Kepala Tukang</option></select><span className=\"mt-1 block text-[11px] text-slate-500\">Pinjaman kumpulan akan ditolak daripada jumlah bayaran semua pekerja bawah Kepala Tukang untuk projek ini.</span></label>\n        <label><span className=\"field-label\">Tarikh</span>",
            'advance scope field')
          s = replace_once(s,
            "          <div className=\"mt-2 flex justify-between text-sm text-amber-300\"><span>Tolak pinjaman</span><strong>{formatMoney(crewTotals.advances)}</strong></div>\n          <div className=\"mt-3 flex justify-between border-t border-slate-700 pt-3\"><span className=\"font-black\">Tunai beri kepada {selectedCrewLeader.name}</span>",
            "          <div className=\"mt-2 flex justify-between text-sm text-amber-200\"><span>Tolak pinjaman pekerja</span><strong>{formatMoney(crewTotals.personalAdvances)}</strong></div>\n          <div className=\"mt-2 flex justify-between text-sm text-amber-300\"><span>Tolak pinjaman kumpulan</span><strong>{formatMoney(crewTotals.groupAdvances)}</strong></div>\n          <div className=\"mt-3 flex justify-between border-t border-slate-700 pt-3\"><span className=\"font-black\">Tunai beri kepada {selectedCrewLeader.name}</span>",
            'crew modal group advance')
          s = replace_once(s,
            "            <SimpleMetric label=\"Pinjaman\" value={formatMoney(summary.advances)} tone=\"amber\" />",
            "            <SimpleMetric label={summary.groupAdvances > 0 ? 'Pinjaman · termasuk group' : 'Pinjaman'} value={formatMoney(summary.advances)} tone=\"amber\" />",
            'crew summary pinjaman label')
          wage.write_text(s)
          PY

          git rm .github/workflows/patch-workforce-group-advance-ui.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/mrpi-workforce/src/types/domain.ts apps/mrpi-workforce/src/lib/queries.ts apps/mrpi-workforce/src/pages/WagePage.tsx
          git commit -m 'feat(workforce): handle crew advances as group deductions'
          git push
